# CI: verify the backend on every push and pull request.
# Throwaway credentials only — nothing secret lives in this file or the repo.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: testing
      DB_NAME: super_teacher_db_test
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: ci

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: super_teacher_db_test
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d super_teacher_db_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Provision the isolated test role
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          export CI_FIXTURE_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$CI_FIXTURE_PASSWORD"
          docker exec -i -e CI_FIXTURE_PASSWORD "$POSTGRES_CONTAINER" \
            psql -X -v ON_ERROR_STOP=1 -U ci_admin -d "$DB_NAME" <<'SQL'
          \getenv fixture_password CI_FIXTURE_PASSWORD
          CREATE ROLE ci LOGIN PASSWORD :'fixture_password';
          ALTER DATABASE super_teacher_db_test OWNER TO ci;
          REVOKE CONNECT ON DATABASE postgres, template1 FROM PUBLIC;
          GRANT EXECUTE ON FUNCTION pg_catalog.pg_control_system() TO ci;
          SQL
          system_id=$(docker exec "$POSTGRES_CONTAINER" \
            psql -XAt -v ON_ERROR_STOP=1 -U ci_admin -d "$DB_NAME" \
              -c 'SELECT system_identifier FROM pg_catalog.pg_control_system()')
          test -n "$system_id"
          echo "DB_PASSWORD=$CI_FIXTURE_PASSWORD" >> "$GITHUB_ENV"
          echo "SUPERTEACHER_TEST_PG_SYSTEM_ID=$system_id" >> "$GITHUB_ENV"

      - name: Apply migrations
        run: |
          python -c "from tests.conftest import _verified_pg_engine; _verified_pg_engine(check_schema=False).dispose()"
          python -m alembic upgrade head

      - name: Verify schema against the ORM
        run: python scripts/verify_database.py --live

      - name: Run unit and integration tests
        run: |
          python -m pytest -m "" --junitxml="$RUNNER_TEMP/pytest.xml"
          python - "$RUNNER_TEMP/pytest.xml" <<'PYTHON'
          import sys
          import xml.etree.ElementTree as ET

          suite, = ET.parse(sys.argv[1]).getroot().findall("testsuite")
          if any(int(suite.attrib[key]) for key in ("errors", "failures", "skipped")):
              raise SystemExit("Required PostgreSQL suite had errors, failures, or skips")
          if int(suite.attrib["tests"]) < 1865:
              raise SystemExit("Required suite did not reach the baseline case count")
          PYTHON
