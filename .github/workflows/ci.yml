# CI: verify the backend on every push and pull request.
# Throwaway credentials only — nothing secret lives in this file or the repo.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: testing
      DB_NAME: super_teacher_db_test
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: ci
      DB_PASSWORD: ci

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: super_teacher_db_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d super_teacher_db_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Apply migrations
        run: python -m alembic upgrade head

      - name: Verify schema against the ORM
        run: python scripts/verify_database.py --live

      - name: Run unit and integration tests
        run: python -m pytest -m ""
