# pytest configuration for the SuperTeacher backend.
# Run from backend/:
#   python -m pytest                       # unit tests only (default)
#   python -m pytest -m integration        # PostgreSQL integration tests
#   python -m pytest -m ""                 # everything
[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -m "not integration" --cov=app --cov-report=term-missing
markers =
    integration: tests that require a real PostgreSQL test database (deselect with -m "not integration")
filterwarnings =
    ignore::DeprecationWarning:starlette.testclient
    ignore::DeprecationWarning:slowapi
    ignore::DeprecationWarning:anyio
    ignore::jwt.warnings.InsecureKeyLengthWarning
